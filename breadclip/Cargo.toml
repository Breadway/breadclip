[package]
name = "breadclip"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "breadclip"
path = "src/main.rs"

[dependencies]
breadclip-core = { path = "../breadclip-core" }
bread-theme = { git = "https://github.com/Breadway/bread-ecosystem", tag = "v0.2.8", features = ["gtk"] }
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
serde_json = "1"
