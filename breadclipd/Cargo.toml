[package]
name = "breadclipd"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "breadclipd"
path = "src/main.rs"

[dependencies]
breadclip-core = { path = "../breadclip-core" }
# Pilot for breadbug (ECO-68): pinned to the bread-ecosystem tag that carries
# the bug module. Move off the tag only if that module changes.
bread-utils = { git = "https://git.breadway.dev/Breadway/bread-ecosystem", tag = "v0.8.1", features = ["bread-client"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
