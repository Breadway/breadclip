[package]
name = "breadclipd"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "breadclipd"
path = "src/main.rs"

[dependencies]
breadclip-core = { path = "../breadclip-core" }
# Pilot for breadbug (ECO-68): uses the feature branch until bread-utils is
# tagged with the bug module, then this goes back to a tag.
bread-utils = { git = "https://git.breadway.dev/Breadway/bread-ecosystem", branch = "feature/breadbug-client", features = ["bread-client"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
