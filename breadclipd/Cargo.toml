[package]
name = "breadclipd"
version = "0.2.4"
edition = "2021"

[[bin]]
name = "breadclipd"
path = "src/main.rs"

[dependencies]
breadclip-core = { path = "../breadclip-core" }
bread-utils = { git = "https://git.breadway.dev/Breadway/bread-ecosystem", tag = "v0.7.2", features = ["bread-client"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
