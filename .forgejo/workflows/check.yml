name: check

# Fast-fail lint/test on short-lived work branches, and on `main` itself:
# a push to main immediately triggers a dev-track release build, so it
# should be linted/tested first, not shipped unchecked.
#
# Builds in the same dev mode as dev-release.yml (git.breadway.dev
# dependencies patched to their own repo's main via bread-ecosystem's
# scripts/dev-deps.sh, no --locked), so a PR that depends on a
# just-merged, not-yet-tagged change in bread-ecosystem passes here
# instead of only being testable after a tag bump. See bread-ecosystem's
# docs/release-channels.md ("Cross-repo dependency resolution") for the
# full model. Part of ECO-38.
on:
  push:
    branches: ['feature/**', 'fix/**', 'main']

jobs:
  check:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        shell: bash
        run: |
          set -euo pipefail
          # Inline bootstrap of bread-ecosystem scripts/ci-checkout.sh (see
          # its docs/ci-checkout.md); keep this block in sync with that helper.
          # Checks out the exact event commit into a directory this job owns.
          if ! [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "checkout: GITHUB_SHA is not a full commit id" >&2
              exit 1
          fi
          checkout=$(mktemp -d "${RUNNER_TEMP:-/tmp}/bread-ci.XXXXXX")
          printf 'BREAD_CI_JOB_DIR=%s\n' "$checkout" >> "$GITHUB_ENV"
          git clone --no-checkout "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "$checkout/src"
          git -C "$checkout/src" -c advice.detachedHead=false checkout --quiet --detach "$GITHUB_SHA"
          actual="$(git -C "$checkout/src" rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
              echo "checkout: HEAD is $actual, expected $GITHUB_SHA" >&2
              exit 1
          fi

      - name: clone bread-ecosystem (main)
        run: |
          set -euo pipefail
          ECOSYSTEM_CI_DIR="$(mktemp -d /tmp/bread-ecosystem-check-XXXXXX)"
          git clone --branch main https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECOSYSTEM_CI_DIR}"
          echo "ECOSYSTEM_CI_DIR=${ECOSYSTEM_CI_DIR}" >> "$GITHUB_ENV"

      # Fails if any git.breadway.dev dependency in src's Cargo.toml uses
      # rev/branch/path instead of tag. Cargo.toml itself must always stay
      # tag-pinned; dev-mode resolution to main happens only at build time,
      # below, never by editing the manifest.
      - name: lint git.breadway.dev dependency pins
        run: bash "${ECOSYSTEM_CI_DIR}/scripts/lint-pins.sh" --root "$BREAD_CI_JOB_DIR/src"

      # DEV_DEPS_DIR is left at its default (a true sibling of src, in the
      # job's own working directory): ci/build.sh's docker wrapper mounts
      # src's PARENT directory (not just src itself), so a sibling clone is
      # visible inside the container at the same relative position as on
      # the host. breadclip is itself a Cargo workspace; forcing the clone
      # *inside* src instead breaks Cargo's workspace-field inheritance,
      # see bread-ecosystem's ci/build.sh for the full explanation.
      - name: resolve dev dependencies to main
        run: |
          set -euo pipefail
          cd "$BREAD_CI_JOB_DIR/src"
          # This workspace intentionally has two bread-utils tag versions
          # (0.7.2 and 0.8.1). Until dev-deps.sh qualifies package IDs, make
          # its update argument unambiguous for this multi-version workspace.
          python3 - "${ECOSYSTEM_CI_DIR}/scripts/dev-deps.sh" <<'PY'
          from pathlib import Path
          import sys

          script = Path(sys.argv[1])
          text = script.read_text()
          old = 'UPDATE_ARGS+=(-p "${crate}")'
          replacement = '''if [ "${crate}" = "bread-utils" ]; then
              UPDATE_ARGS+=(-p "bread-utils@0.7.2" -p "bread-utils@0.8.1")
          else
              UPDATE_ARGS+=(-p "${crate}")
          fi'''
          if old not in text:
              raise SystemExit("dev-deps.sh update argument format changed; refusing workaround")
          script.write_text(text.replace(old, replacement, 1))
          PY
          bash "${ECOSYSTEM_CI_DIR}/scripts/dev-deps.sh" --root .
          rm -rf "${ECOSYSTEM_CI_DIR}"

      - name: clippy
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo test --workspace

      # Runs last so no earlier step loses its tree. Removes only this job's
      # own checkout directory, and only under RUNNER_TEMP.
      - name: clean owned checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BREAD_CI_JOB_DIR:-}" == "${RUNNER_TEMP:-/tmp}"/bread-ci.* && -d "$BREAD_CI_JOB_DIR" ]]; then
            rm -rf -- "$BREAD_CI_JOB_DIR"
          fi
